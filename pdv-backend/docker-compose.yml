version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: stech_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 8wLLlyI3kO3O6iDuDrrJrMmTxyrtbs4N3nEXBmUw2n18RelSER9BCXuphpYt0O4Y
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - stech-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stech_app
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/postgres
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 8wLLlyI3kO3O6iDuDrrJrMmTxyrtbs4N3nEXBmUw2n18RelSER9BCXuphpYt0O4Y
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db
    # ports:
    #   - "8080:8080"
    networks:
      - stech-net

volumes:
  pgdata:

networks:
  stech-net:
    driver: bridge