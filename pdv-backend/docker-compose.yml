version: "3.9"

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 8wLLlyI3kO3O6iDuDrrJrMmTxyrtbs4N3nEXBmUw2n18RelSER9BCXuphpYt0O4Y
      POSTGRES_DB: stech_db2
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - stech-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    # container_name REMOVIDO! Necessário para permitir o deploy sem queda.
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/stech_db2
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 8wLLlyI3kO3O6iDuDrrJrMmTxyrtbs4N3nEXBmUw2n18RelSER9BCXuphpYt0O4Y
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db
    networks:
      - stech-net
      - coolify
    healthcheck:
      # Tenta a rota /actuator/health e faz fallback para /api/produtos caso o Actuator não esteja instalado
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || wget --spider -q http://localhost:8080/api/produtos || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  adminer:
    image: adminer:latest
    restart: unless-stopped
    ports:
      - "8088:8080"
    networks:
      - stech-net

volumes:
  pgdata:

networks:
  stech-net:
    driver: bridge
  coolify:
    external: true