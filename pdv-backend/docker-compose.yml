version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: stech_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 8wLLlyI3kO3O6iDuDrrJrMmTxyrtbs4N3nEXBmUw2n18RelSER9BCXuphpYt0O4Y
      POSTGRES_DB: stech_db2
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - stech-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stech_app
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/stech_db2
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 8wLLlyI3kO3O6iDuDrrJrMmTxyrtbs4N3nEXBmUw2n18RelSER9BCXuphpYt0O4Y
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db
    networks:
      - stech-net
      - coolify  # <-- Conecta o App diretamente ao Traefik do Coolify
    healthcheck: # <-- CORRIGIDO: Agora o Healthcheck está no container certo!
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  adminer:
    image: adminer:latest
    container_name: stech_adminer
    restart: unless-stopped
    ports:
      - "8088:8080"
    networks:
      - stech-net

volumes:
  pgdata:

networks:
  stech-net:
    driver: bridge
  coolify:      # <-- Declara a rede externa do Coolify
    external: true