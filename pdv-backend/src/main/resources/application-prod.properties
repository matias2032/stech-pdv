# ===================================
# DATASOURCE — Neon PostgreSQL (SSL obrigatório)
# ===================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===================================
# HIKARICP — Pool conservador para Neon free tier
# ===================================
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# ===================================
# JPA / HIBERNATE
# ===================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.properties.jakarta.persistence.validation.mode=auto

# ===================================
# SERVIDOR
# ===================================
server.port=${PORT:8080}
server.servlet.context-path=/

# ===================================
# FLYWAY
# ===================================
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===================================
# JACKSON — fuso de Maputo
# ===================================
spring.jackson.time-zone=Africa/Maputo
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss

# ===================================
# ENCODING
# ===================================
spring.http.encoding.charset=UTF-8
spring.http.encoding.enabled=true
spring.http.encoding.force=true

# ===================================
# SYNC
# ===================================
sync.cloud.base-url=${SYNC_CLOUD_BASE_URL:}
sync.cloud.api-key=${SYNC_CLOUD_API_KEY}
sync.api-key=${SYNC_API_KEY}

# ===================================
# FIREBASE
# ===================================
firebase.service-account.path=${FIREBASE_SERVICE_ACCOUNT_PATH:firebase-service-account.json}

# ===================================
# ASYNC
# ===================================
spring.task.execution.pool.core-size=2

# ===================================
# LOGS — menos verboso em produção
# ===================================
logging.level.root=WARN
logging.level.com.stechengenharia.pdv_backend=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.security=WARN

# ===================================
# DOCKER COMPOSE — desactivado em produção
# ===================================
spring.docker.compose.enabled=false